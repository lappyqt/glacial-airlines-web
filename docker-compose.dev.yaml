services:
  database:
    image: postgres:18.3
    container_name: postgres_dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: glacial_db
      POSTGRES_USER: glacial_user
      POSTGRES_PASSWORD: glacial_password
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
    name: postgres-dev-data