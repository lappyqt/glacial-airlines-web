services:
  database:
    image: postgres:18.3
    container_name: postgres_dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: glacial_db
      POSTGRES_USER: glacial_user
      POSTGRES_PASSWORD: glacial_password
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.6.3-alpine
    container_name: redis_dev
    ports:
      - "6379:6379"
    command: redis-server --requirepass glacial_redis_password --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
volumes:
  postgres-data:
    name: postgres-dev-data
  redis-data:
    name: redis-dev-data

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24