<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование — Пассажиры | Glacial Airlines</title>
    <link rel="stylesheet" th:href="@{/dist/index.css}">
</head>
<body>
    <header th:replace="~{fragments/common.html :: header}"></header>

    <div class="wrapper booking">
        <div class="content-wrapper booking passengers">
            <div class="step-indicator-container booking-section" th:insert="~{/fragments/booking.html :: step-indicator(1)}"></div>

            <div class="order-brief-info booking-section">
                <div class="header-row">
                    <span class="flight-route">Екатеринбург (SVX) → Москва (MOW)</span>
                    <span class="price-title">Стоимость</span>
                </div>
                <div class="content-row">
                    <span class="brief-flight-info">Рейс EK 132 • Туда и обратно • 1 Пассажир</span>
                    <span class="price">200 000 RUB</span>
                </div>
            </div>

            <div class="passengers-data booking-section">
                <div class="content-block">
                    <div class="header">
                        <span class="title">Пассажир 1</span>
                        <span class="subtitle">Взрослый</span>
                    </div>
                    
                    <div class="content column-flex-container">
                        <div class="row">
                            <div class="floating-input-group">
                                <input id="lastname" type="text" class="input" placeholder=" " autocomplete="off">
                                <label for="lastname" class="floating-label">Фамилия</label>
                            </div>
                            <div class="floating-input-group">
                                <input id="firstname" type="text" class="input" placeholder=" " autocomplete="off">
                                <label for="firstname" class="floating-label">Имя</label>
                            </div>
                            <div class="floating-input-group">
                                <input id="middlename" type="text" class="input" placeholder=" " autocomplete="off">
                                <label for="middlename" class="floating-label">Отчество</label>
                            </div>
                        </div>

                        <div class="row">
                            <select class="select" id="sex">
                                <option value="male">Мужской</option>
                                <option value="female">Женский</option>
                            </select>

                            <div class="floating-input-group">
                                <input id="birthDate" type="text" class="input" placeholder=" " autocomplete="off">
                                <label for="birthDate" class="floating-label">Дата рождения</label>
                            </div>
                        </div>

                        <div class="row">
                            <select class="select" id="document-type">
                                <option value="passport">Паспорт РФ</option>
                                <option value="international-passport">Загранпаспорт</option>
                                <option value="birth-certificate">Свидетельство о рождении</option>
                            </select>

                            <div class="floating-input-group">
                                <input id="documentNumber" type="text" class="input" placeholder=" " autocomplete="off">
                                <label for="documentNumber" class="floating-label">Серия и номер</label>
                            </div>                            
                        </div>
                    </div>
                </div>

                <div class="content-block">
                    <div class="header">
                        <span class="title">Контактные данные заказа</span>
                        <span class="subtitle"></span>
                    </div>
                    
                    <div class="content column-flex-container">
                        <div class="information-note">
                            На данную почту придёт маршрутная квитанция и уведомления об изменении рейса
                        </div>

                        <div class="row">
                            <div class="floating-input-group">
                                <input id="contact-email" type="text" class="input" placeholder=" " autocomplete="off">
                                <label for="contact-email" class="floating-label">Контактная почта</label>
                            </div>
                            <div class="floating-input-group">
                                <input id="contact-phone" type="text" class="input" placeholder=" " autocomplete="off">
                                <label for="contact-phone" class="floating-label">Контактный телефон</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="navigation-row">
                    <a th:href="@{/booking/return-flight}" class="outline-button">
                        Назад к рейсам
                    </a>
                    <a th:href="@{/booking/services}" class="outline-button">
                        Перейти к услугам
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/common.html :: footer}"></footer>
</body>
</html>
