<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование — Обратный рейс | Glacial Airlines</title>
    <link rel="stylesheet" th:href="@{/dist/index.css}">
    <script th:src="@{/dist/index.js}"></script>
</head>
<body>
    <header th:replace="~{fragments/common.html :: header}"></header>

    <div class="wrapper booking">
        <div class="content-wrapper booking">
            <div class="booking-section previous-flight">
                <div class="text-info">
                    <p class="title">Вы выбрали перелёт туда</p>
                    <p class="flight-route" th:text="${outboundFlight.departureCity + ' - ' + outboundFlight.arrivalCity}"></p>
                </div>

                <div th:replace="~{fragments/booking.html :: flight-offer-card(${outboundFlight}, '/search?' + ${searchRequestDto.toQueryString('search')}, 'Изменить')}"></div>
            </div>

            <div class="flight-info booking-section-wide" th:if="${not #lists.isEmpty(flightOffers)}"
                 th:with="returnRoute=${outboundFlight.arrivalCity + ' - ' + outboundFlight.departureCity}"
                 th:insert="~{fragments/booking.html :: cheapest-flight-info-block('Выберите обратный рейс', ${arrivalCity + ' - ' + departureCity}, ${minPrice})}">
            </div>

            <div class="offer-cards-filters booking-section" th:if="${not #lists.isEmpty(flightOffers)}" th:insert="~{fragments/booking.html :: offer-cards-filters}"></div>

            <div class="offer-flight-cards booking-section" th:if="${not #lists.isEmpty(flightOffers)}">
                <th:block th:each="flightOffer : ${flightOffers}">
                    <div
                        th:replace="~{fragments/booking.html :: flight-offer-card(${flightOffer}, '/booking/select-return?returnFlightId=' + ${flightOffer.flightId}, null)}">
                    </div>
                </th:block>
            </div>

            <th:block th:if="${#lists.isEmpty(flightOffers)}">
                <div th:replace="~{fragments/booking.html :: no-content-section('Рейсы на эту дату не найдены, начните поиск заново.')}"></div>
            </th:block>
        </div>
    </div>

    <footer th:replace="~{fragments/common.html :: footer}"></footer>
</body>
</html>
